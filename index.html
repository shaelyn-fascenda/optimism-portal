<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Optimism Weekly Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400&display=swap">
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: Inter, -apple-system, 'Segoe UI', system-ui, sans-serif; color: #1E1B18; background: #FBF8F4; }
main { width: 100%; max-width: 420px; background: #FFFFFF; border: 1px solid #E7DFD5; border-top: 4px solid #E3652B; border-radius: 12px; padding: 36px 28px; box-shadow: 0 10px 30px rgba(40,25,10,.08); }
img { height: 34px; width: auto; display: block; margin-bottom: 32px; }
.eyebrow { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: #6B635B; margin: 0 0 10px; }
h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.15; margin: 0 0 10px; }
p.lede { color: #4A433D; font-size: 15px; line-height: 1.5; margin: 0 0 26px; }
label { display: block; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: #6B635B; margin-bottom: 8px; }
input[type=password] { width: 100%; height: 48px; border-radius: 8px; border: 1px solid #D9CFC3; background: #FFFFFF; color: #1E1B18; padding: 0 14px; font: inherit; font-size: 16px; }
input[type=password]:focus { outline: 2px solid #E3652B; outline-offset: 1px; border-color: #E3652B; }
.row { display: flex; align-items: center; gap: 8px; margin: 14px 0 22px; color: #6B635B; font-size: 13px; }
.row input { width: 18px; height: 18px; accent-color: #E3652B; margin: 0; }
button { width: 100%; height: 48px; border: 0; border-radius: 8px; background: #1E1B18; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; }
button:hover { background: #3A332D; } button:disabled { opacity: .6; cursor: progress; }
.err { min-height: 20px; margin: 14px 0 0; font-size: 13px; color: #B4412F; }
.foot { margin-top: 26px; font-size: 12.5px; color: #6B635B; }
</style></head>

const un = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const store = { get() { try { return localStorage.getItem('ow-key'); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem('ow-key', v); } catch (e) {} }, clear() { try { localStorage.removeItem('ow-key'); } catch (e) {} } };
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: un(B.s), iterations: B.r }, base, 256));
}
async function open(raw) {

  document.open(); document.write(html); document.close();
}
// A saved key only opens the report it was made for; after the password changes it fails quietly and the form shows.

  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Opening'; err.textContent = '';

    const raw = await keyFrom(document.getElementById('pw').value);
